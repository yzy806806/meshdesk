<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MeshDesk Topology Test</title>
<style>
  body { margin: 20px; background: #0a0a1a; color: #0f0; font-family: monospace; }
  .node { margin: 4px 0; padding: 4px 8px; background: rgba(0,255,136,0.1); border-radius: 4px; }
  .node.offline { background: rgba(255,51,51,0.1); color: #f66; }
  .edge { color: #66f; font-size: 12px; margin-left: 20px; }
  .error { color: #f33; }
  canvas { display: none; }
</style>
</head>
<body>
<h3>MeshDesk Topology — API Contract Verification</h3>
<div id="status">Loading...</div>
<div id="results"></div>

<script>
window.__topologyTest = {
  status: 'loading',
  nodeCount: 0,
  edgeCount: 0,
  errors: [],
  nodes: [],
  edges: [],
  fetchStatus: null,
  fetchDurationMs: 0
};

const t0 = performance.now();

fetch('/api/topology')
  .then(r => {
    window.__topologyTest.fetchStatus = r.status;
    return r.json();
  })
  .then(data => {
    const t1 = performance.now();
    window.__topologyTest.fetchDurationMs = Math.round(t1 - t0);
    window.__topologyTest.nodes = data.nodes || [];
    window.__topologyTest.edges = data.edges || [];
    window.__topologyTest.nodeCount = data.nodes ? data.nodes.length : 0;
    window.__topologyTest.edgeCount = data.edges ? data.edges.length : 0;

    // Validate schema.
    const errors = [];
    const results = [];

    function addResult(label, pass) {
      results.push({ label, pass });
      document.getElementById('results').innerHTML +=
        '<div class="' + (pass ? '' : 'error') + '">' +
        (pass ? '✓' : '✗') + ' ' + label + '</div>';
    }

    // 1. Status code.
    addResult('HTTP 200 OK', window.__topologyTest.fetchStatus === 200);

    // 2. Response is valid JSON with nodes/edges.
    addResult('Has "nodes" array', Array.isArray(data.nodes));
    addResult('Has "edges" array', Array.isArray(data.edges));

    // 3. Every node has required fields.
    let allNodesValid = data.nodes.length > 0;
    data.nodes.forEach((n, i) => {
      if (!n.id || !n.role) {
        allNodesValid = false;
        errors.push('Node ' + i + ' missing id or role');
      }
      if (typeof n.x !== 'number' || typeof n.y !== 'number' || typeof n.z !== 'number') {
        allNodesValid = false;
        errors.push('Node ' + i + ' has non-numeric position');
      }
      if (n.x < -500 || n.x > 500 || n.y < -500 || n.y > 500 || n.z < -500 || n.z > 500) {
        errors.push('Node ' + n.id + ' position out of [-500,500] range');
      }
      if (n.status !== 'online' && n.status !== 'offline') {
        errors.push('Node ' + n.id + ' invalid status: ' + n.status);
      }
    });
    addResult('All nodes have id, role, position', allNodesValid);

    // 4. Edge validation.
    let allEdgesValid = true;
    const allSets = new Set(data.nodes.map(n => n.id));
    data.edges.forEach((e, i) => {
      if (!e.source || !e.target) {
        allEdgesValid = false;
        errors.push('Edge ' + i + ' missing source or target');
      }
      if (typeof e.latency_ms !== 'number') {
        allEdgesValid = false;
        errors.push('Edge ' + i + ' non-numeric latency_ms');
      }
      if (typeof e.bandwidth_mbps !== 'number') {
        allEdgesValid = false;
        errors.push('Edge ' + i + ' non-numeric bandwidth_mbps');
      }
      if (e.source && !allSets.has(e.source)) errors.push('Edge source ' + e.source + ' not in nodes');
      if (e.target && !allSets.has(e.target)) errors.push('Edge target ' + e.target + ' not in nodes');
    });
    addResult('All edges have valid fields', data.edges.length === 0 || allEdgesValid);

    // 5. Online nodes have CPU > 0.
    let onlineCPUOk = true;
    data.nodes.forEach(n => {
      if (n.status === 'online' && n.cpu <= 0) onlineCPUOk = false;
    });
    addResult('Online nodes have CPU > 0', onlineCPUOk);

    // 6. Position range.
    addResult('All nodes in [-500,500]', errors.filter(e => e.includes('position')).length === 0);

    // 7. Fetch was fast.
    addResult('Fast response (< 100ms)', window.__topologyTest.fetchDurationMs < 100);

    // Render node list.
    document.getElementById('results').innerHTML += '<br><b>Nodes (' + data.nodes.length + '):</b>';
    data.nodes.forEach(n => {
      const cls = n.status === 'offline' ? ' offline' : '';
      document.getElementById('results').innerHTML +=
        '<div class="node' + cls + '">' +
        n.id.substring(0,12) + '... ' +
        n.role + ' @ (' + n.x.toFixed(0) + ',' + n.y.toFixed(0) + ',' + n.z.toFixed(0) + ') ' +
        'CPU:' + n.cpu.toFixed(1) + '% Mem:' + n.mem.toFixed(1) + '% ' +
        '(' + n.status + ')' +
        '</div>';
    });

    if (data.edges.length > 0) {
      document.getElementById('results').innerHTML += '<br><b>Edges (' + data.edges.length + '):</b>';
      data.edges.forEach(e => {
        document.getElementById('results').innerHTML +=
          '<div class="edge">' + e.source.substring(0,8) + ' → ' + e.target.substring(0,8) +
          ' lat:' + e.latency_ms + 'ms bw:' + e.bandwidth_mbps + 'Mbps</div>';
      });
    }

    // Record errors.
    window.__topologyTest.errors = errors;
    window.__topologyTest.status = errors.length === 0 ? 'ready' : 'error';

    document.getElementById('status').textContent =
      window.__topologyTest.status === 'ready'
        ? 'READY — All checks passed (' + window.__topologyTest.fetchDurationMs + 'ms)'
        : 'ERROR — ' + errors.length + ' validation issues';
  })
  .catch(err => {
    window.__topologyTest.errors.push('Fetch failed: ' + err.message);
    window.__topologyTest.status = 'error';
    document.getElementById('status').textContent = 'ERROR: ' + err.message;
  });
</script>
</body>
</html>
